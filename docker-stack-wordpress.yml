services:
  wordpress:
    image: wordpress:php8.2-fpm-alpine
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - WORDPRESS_CONFIG_EXTRA=
          define('WP_REDIS_HOST', 'redis');
          define('WP_REDIS_PORT', 6379);
          define('WP_CACHE', true);
          define('WP_CACHE_KEY_SALT', '${DOMAIN}');
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wordpress_internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: nginx:alpine
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./config/nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wordpress_internal
      - proxy
    depends_on:
      - wordpress
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        # HTTP
        - "traefik.http.routers.wordpress.entrypoints=http"
        - "traefik.http.routers.wordpress.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.wordpress.middlewares=wordpress-https-redirect"
        # HTTPS
        - "traefik.http.routers.wordpress-secure.entrypoints=https"
        - "traefik.http.routers.wordpress-secure.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.wordpress-secure.tls=true"
        - "traefik.http.routers.wordpress-secure.tls.certresolver=cloudflare"
        - "traefik.http.routers.wordpress-secure.service=wordpress"
        # Middlewares
        - "traefik.http.middlewares.wordpress-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.wordpress-https-redirect.redirectscheme.permanent=true"
        # Service
        - "traefik.http.services.wordpress.loadbalancer.server.port=80"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:-wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./data/wordpress/mysql:/var/lib/mysql
      - ./backups/wordpress/mysql:/backups
    networks:
      - wordpress_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WORDPRESS_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  redis:
    image: redis:alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - wordpress_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  backup:
    image: mysql:8.0
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:-wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./backups/wordpress:/backups
      - ./scripts/wordpress-backup.sh:/backup.sh:ro
    networks:
      - wordpress_internal
    entrypoint: ["/bin/sh"]
    command: ["-c", "while true; do sleep 86400; done"]
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  wordpress_data:
    driver: local

networks:
  wordpress_internal:
    driver: overlay
    attachable: true
  proxy:
    external: true
