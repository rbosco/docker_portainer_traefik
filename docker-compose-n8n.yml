# n8n - Docker Compose local (testes)
# Uso:
#   Com Traefik:  docker compose up -d && docker compose -f docker-compose-n8n.yml up -d
#   Só n8n:      docker network create proxy 2>/dev/null; docker compose -f docker-compose-n8n.yml up -d
#   Acesso:      http://localhost:5678  ou  https://<SUBDOMAIN_N8N>.<DOMAIN> (se Traefik estiver no ar)

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_local_test}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_HOST=${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}
      - WEBHOOK_URL=http://${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}:5678/
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - n8n_data:/home/node/.n8n
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.entrypoints=http"
      - "traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n.middlewares=n8n-https-redirect"
      - "traefik.http.routers.n8n-secure.entrypoints=https"
      - "traefik.http.routers.n8n-secure.rule=Host(`${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n-secure.tls=true"
      - "traefik.http.routers.n8n-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-secure.service=n8n"
      - "traefik.http.middlewares.n8n-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.n8n-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"

volumes:
  n8n_data:

networks:
  proxy:
    external: true
