api:
  dashboard: true
  debug: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0    # sem limite — necessário para workflows longos do n8n
        writeTimeout: 0   # sem limite
        idleTimeout: 600  # 10 min para conexões SSE/WebSocket do editor

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    swarmMode: true
    exposedByDefault: false
    network: proxy
    watch: true
  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: ${ACME_EMAIL:-your-email@example.com}
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        delayBeforeCheck: 0

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100
