api:
  dashboard: true
  debug: true

entryPoints:
  http:
    address: ":80"
    # Sem redirect global aqui: Let's Encrypt usa HTTP challenge em :80
    # Cada router aplica redirect para HTTPS via middleware
  https:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0    # sem limite — necessário para workflows longos do n8n
        writeTimeout: 0   # sem limite
        idleTimeout: 600  # 10 min para conexões SSE/WebSocket do editor

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: your-email@example.com
      storage: acme.json
      httpChallenge:
        entryPoint: http

log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
