services:
  n8n:
    image: n8nio/n8n:latest
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${SUBDOMAIN_N8N:-n8n}.${DOMAIN}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN_N8N:-n8n}.${DOMAIN}/
      - WEBHOOK_URL=https://${SUBDOMAIN_N8N:-n8n}.${DOMAIN}/
      - N8N_SECURE_COOKIE=false
      - N8N_TRUST_PROXY_HEADER=true
      - N8N_PROXY_HOPS=1
      - N8N_PROTOCOL=https
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/n8n:/home/node/.n8n
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz 2>/dev/null || wget -qO- http://localhost:5678/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

networks:
  proxy:
    external: true
