services:
  traefik:
    image: traefik:2.10.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard Traefik
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - DOCKER_API_VERSION=1.43
      - CLOUDFLARE_EMAIL=${CF_API_EMAIL}
      - CLOUDFLARE_API_KEY=${CF_API_KEY}
      - CLOUDFLARE_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./data/traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`${SUBDOMAIN_TRAEFIK:-pr}.${DOMAIN:-localhost}`)"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER:-admin:$$apr1$$8EVjn/nj$$GiLUZqcbueTFeD23SuB6x0}"
      - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.traefik.middlewares=traefik-https-redirect"
      - "traefik.http.routers.traefik-secure.entrypoints=https"
      - "traefik.http.routers.traefik-secure.rule=Host(`${SUBDOMAIN_TRAEFIK:-pr}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=${DOMAIN:-localhost}"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${DOMAIN:-localhost}"
      - "traefik.http.routers.traefik-secure.service=api@internal"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/portainer:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=http"
      - "traefik.http.routers.portainer.rule=Host(`${SUBDOMAIN_PORTAINER:-painel}.${DOMAIN:-localhost}`)"
      - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
      - "traefik.http.routers.portainer-secure.entrypoints=https"
      - "traefik.http.routers.portainer-secure.rule=Host(`${SUBDOMAIN_PORTAINER:-painel}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.portainer-secure.service=portainer"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=proxy"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - N8N_HOST=${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}/
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_this_to_a_random_string}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}/
      - N8N_TRUST_PROXY_HEADER=true
      - N8N_PROXY_HOPS=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/n8n:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.entrypoints=http"
      - "traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}`)"
      - "traefik.http.middlewares.n8n-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.n8n-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.n8n.middlewares=n8n-https-redirect"
      - "traefik.http.routers.n8n-secure.entrypoints=https"
      - "traefik.http.routers.n8n-secure.rule=Host(`${SUBDOMAIN_N8N:-n8n}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n-secure.tls=true"
      - "traefik.http.routers.n8n-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.n8n-secure.service=n8n"
      - "traefik.http.routers.n8n-secure.middlewares=n8n-websocket"
      - "traefik.http.middlewares.n8n-websocket.headers.customrequestheaders.Upgrade=websocket"
      - "traefik.http.middlewares.n8n-websocket.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"

  remotion:
    build:
      context: ./remotion
      dockerfile: Dockerfile
    container_name: remotion
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - CHROME_EXECUTABLE_PATH=/usr/bin/chromium
      - REMOTION_CHROME_EXECUTABLE=/usr/bin/chromium
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./remotion/project:/app
      - ./data/remotion/output:/app/out
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.remotion.entrypoints=http"
      - "traefik.http.routers.remotion.rule=Host(`${SUBDOMAIN_REMOTION:-remotion}.${DOMAIN:-localhost}`)"
      - "traefik.http.middlewares.remotion-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.remotion-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.remotion.middlewares=remotion-https-redirect"
      - "traefik.http.routers.remotion-secure.entrypoints=https"
      - "traefik.http.routers.remotion-secure.rule=Host(`${SUBDOMAIN_REMOTION:-remotion}.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.remotion-secure.tls=true"
      - "traefik.http.routers.remotion-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.remotion-secure.service=remotion"
      - "traefik.http.services.remotion.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    driver: bridge
