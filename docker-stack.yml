services:
  traefik:
    image: traefik:2.10.7
    command:
      - --api.dashboard=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_proxy
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.http.address=:80
      - --entrypoints.http.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.http.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.http.transport.respondingTimeouts.idleTimeout=600
      - --entrypoints.https.address=:443
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.https.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.https.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.https.transport.respondingTimeouts.idleTimeout=600
      - --serversTransport.forwardingTimeouts.dialTimeout=300
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=0
      - --serversTransport.forwardingTimeouts.idleConnTimeout=90
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - DOCKER_API_VERSION=1.43
      - CLOUDFLARE_EMAIL=${CF_API_EMAIL}
      - CLOUDFLARE_API_KEY=${CF_API_KEY}
      - CLOUDFLARE_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./data/traefik/acme.json:/acme.json
    networks:
      - proxy
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        # Dashboard HTTP
        - "traefik.http.routers.traefik.entrypoints=http"
        - "traefik.http.routers.traefik.rule=Host(`${SUBDOMAIN_TRAEFIK:-pr}.${DOMAIN}`)"
        - "traefik.http.routers.traefik.middlewares=traefik-https-redirect"
        # Dashboard HTTPS
        - "traefik.http.routers.traefik-secure.entrypoints=https"
        - "traefik.http.routers.traefik-secure.rule=Host(`${SUBDOMAIN_TRAEFIK:-pr}.${DOMAIN}`)"
        - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"
        - "traefik.http.routers.traefik-secure.tls=true"
        - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
        - "traefik.http.routers.traefik-secure.service=api@internal"
        # Middlewares
        - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}"
        - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.permanent=true"
        # Service (necessário para Swarm)
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - proxy
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/portainer:/data
    networks:
      - proxy
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        # HTTP
        - "traefik.http.routers.portainer.entrypoints=http"
        - "traefik.http.routers.portainer.rule=Host(`${SUBDOMAIN_PORTAINER:-painel}.${DOMAIN}`)"
        - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
        # HTTPS
        - "traefik.http.routers.portainer-secure.entrypoints=https"
        - "traefik.http.routers.portainer-secure.rule=Host(`${SUBDOMAIN_PORTAINER:-painel}.${DOMAIN}`)"
        - "traefik.http.routers.portainer-secure.tls=true"
        - "traefik.http.routers.portainer-secure.tls.certresolver=cloudflare"
        - "traefik.http.routers.portainer-secure.service=portainer"
        # Middlewares
        - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.permanent=true"
        # Service
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"

networks:
  proxy:
    driver: overlay
    attachable: true
